[project]
name = "jobsh"
version = "0.1.0"
description = "Local job aggregator with full-text search and MCP access"
authors = [
    { name = "julilili42", email = "Julian-jurcevic-2000@web.de" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=1.26,<2",
    "rich>=14.1,<15",
    "textual>=6,<7",
]

[project.scripts]
jobsh = "jobsh.cli:main"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"
